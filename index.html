}
        }


        function openDMCA() {

            const panel = document.getElementById("dmcaPanel");

            panel.style.display = "block";

            panel.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }


        function closeDMCA() {

            const panel = document.getElementById("dmcaPanel");

            panel.style.display = "none";
        }


        showStep();

    </script>
