<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Access Check</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background: #edf3fa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    color: #151c2b;

    display: flex;
    justify-content: center;

    padding: 25px 12px 30px;
}

.page {
    width: 100%;
    max-width: 430px;
}

/* CARD */

.card {
    background: #ffffff;
    border-radius: 32px;
    overflow: hidden;

    box-shadow:
        0 18px 45px rgba(40, 65, 90, 0.10),
        0 2px 8px rgba(40, 65, 90, 0.05);

    text-align: center;
}

/* CONTENT */

.content {
    padding: 48px 22px 35px;
}

.small-title {
    color: #16b59f;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1.2px;

    margin-bottom: 22px;
}

h1 {
    margin: 0 auto 22px;

    max-width: 360px;

    font-size: 38px;
    line-height: 1.08;
    letter-spacing: -1px;
    font-weight: 800;
}

.description {
    margin: 0 auto 30px;

    max-width: 340px;

    color: #6f7888;
    font-size: 17px;
    line-height: 1.45;
}

.instruction {
    color: #202938;
    font-size: 17px;
    font-weight: 700;

    margin-bottom: 30px;
}

/* REAL LINK */

.hold-link {
    display: block;

    width: 215px;
    height: 215px;

    margin: 0 auto;

    padding: 7px;

    border-radius: 50%;

    background: #c8e8e5;

    text-decoration: none;

    cursor: pointer;

    -webkit-user-select: none;
    user-select: none;

    -webkit-touch-callout: default;
}

.hold-inner {
    width: 100%;
    height: 100%;

    border-radius: 50%;

    background: #ffffff;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    box-shadow:
        inset 0 0 0 1px #edf0f3,
        0 8px 22px rgba(50, 70, 90, 0.08);
}

.lock {
    font-size: 43px;
    line-height: 1;

    margin-bottom: 17px;
}

.press-text {
    color: #7b8799;

    font-size: 15px;
    font-weight: 800;

    letter-spacing: 1.3px;
}

.hold-caption {
    margin-top: 20px;

    color: #7d8999;

    font-size: 14px;
    font-weight: 600;
}

/* INFO */

.info {
    border-top: 1px solid #edf0f3;

    padding: 22px 25px;

    display: flex;
    align-items: center;

    gap: 13px;

    text-align: left;
}

.info-icon {
    flex-shrink: 0;

    width: 34px;
    height: 34px;

    border-radius: 50%;

    background: #dce2ea;

    color: #ffffff;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 19px;
    font-weight: 700;
}

.info-text {
    color: #7b8696;

    font-size: 13px;
    line-height: 1.4;
}

/* FOOTER */

.footer {
    text-align: center;

    color: #909baa;

    font-size: 12px;

    margin-top: 20px;
}

.footer a {
    color: #7d8795;
    text-decoration: underline;
}

/* SMALL PHONES */

@media (max-width: 380px) {

    body {
        padding: 15px 10px 25px;
    }

    .content {
        padding: 40px 18px 30px;
    }

    h1 {
        font-size: 34px;
    }

    .description {
        font-size: 16px;
    }

    .hold-link {
        width: 190px;
        height: 190px;
    }

    .lock {
        font-size: 38px;
    }

    .press-text {
        font-size: 13px;
    }
}
</style>
</head>


<body>

<div class="page">

    <div class="card">

        <div class="content">

            <div class="small-title">
                PRIVATE ACCESS CHECK
            </div>

            <h1>
                You must be 18+<br>
                to proceed
            </h1>

            <div class="description">
                This page may contain adult-oriented
                dating content.
            </div>

            <div class="instruction">
                Press and hold to verify your age
            </div>


            <!--
                REAL LINK

                Long-pressing this element allows
                Safari/Chrome to show its native
                link menu when supported.
            -->

            <a
                class="hold-link"
                href="https://mndvg.hornysspace.com/?utm_source=da57dc555e50572d&ban=snap&j1=1&s1=50252&s2=2278468"
            >

                <div class="hold-inner">

                    <div class="lock">
                        🔒
                    </div>

                    <div class="press-text">
                        PRESS &amp; HOLD
                    </div>

                </div>

            </a>


            <div class="hold-caption">
                Press and hold to continue
            </div>

        </div>


        <div class="info">

            <div class="info-icon">
                i
            </div>

            <div class="info-text">
                Age confirmation helps keep this
                experience safe.
            </div>

        </div>

    </div>


    <div class="footer">

        © 2026 ·
        <a href="#">Terms of Service</a>
        ·
        <a href="#">Privacy Policy</a>

    </div>

</div>

</body>
</html>
