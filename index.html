<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#0a0013;
overflow-y:auto;
overflow-x:hidden;
color:#fff;
cursor:pointer;
}

/* BACKGROUND */

.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.75)),
url('https://i.ibb.co/Y70sp3Gv/IMG-2446.jpg') center/cover no-repeat;
filter:blur(6px);
transform:scale(1.1);
z-index:-2;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.35);
z-index:-1;
}

/* TOP BAR */

.topbar{
width:100%;
background:linear-gradient(90deg,#ff1d8e,#b22cff);
padding:22px;
text-align:center;
font-size:20px;
font-weight:900;
letter-spacing:2px;
box-shadow:0 0 25px rgba(255,0,140,.5);
}

/* MAIN */

.main{
padding:22px;
max-width:450px;
margin:auto;
}

/* PROFILE */

.profile-box{
display:flex;
align-items:center;
gap:18px;
margin-top:18px;
margin-bottom:28px;
}

.avatar{
position:relative;
width:105px;
height:105px;
border-radius:50%;
padding:4px;
background:linear-gradient(180deg,#ff1d8e,#ff4bc1);
box-shadow:0 0 25px rgba(255,0,120,.6);
}

.avatar img{
width:100%;
height:100%;
border-radius:50%;
object-fit:cover;
border:3px solid #111;
}

.live-tag{
position:absolute;
bottom:-5px;
left:50%;
transform:translateX(-50%);
background:#ff006a;
padding:7px 18px;
border-radius:12px;
font-size:14px;
font-weight:900;
border:2px solid #111;
display:flex;
align-items:center;
}

.live-dot{
width:9px;
height:9px;
background:#fff;
border-radius:50%;
margin-right:6px;
animation:blink 1s infinite;
}

@keyframes blink{
0%{opacity:1;}
50%{opacity:.3;}
100%{opacity:1;}
}

.info h1{
font-size:34px;
font-weight:900;
margin-bottom:8px;
}

.verify{
color:#1da1ff;
font-size:24px;
vertical-align:middle;
}

.rating{
color:#ffd400;
font-size:19px;
font-weight:800;
margin-bottom:10px;
}

.stats{
color:#c5c5c5;
font-size:18px;
}

/* VIDEO BOX */

.video-box{
position:relative;
margin-top:15px;
border-radius:34px;
overflow:hidden;
background:#111;
box-shadow:0 0 35px rgba(255,0,140,.25);
border:1px solid rgba(255,255,255,.08);
}

.video-box img{
width:100%;
display:block;
height:640px;
object-fit:cover;
object-position:center top;
filter:brightness(.72);
}

.live-now{
position:absolute;
top:22px;
left:22px;
background:#ff006a;
padding:12px 22px;
border-radius:16px;
font-weight:900;
font-size:16px;
box-shadow:0 0 20px rgba(255,0,120,.6);
display:flex;
align-items:center;
}

.timer{
position:absolute;
top:22px;
right:22px;
background:#111;
padding:12px 18px;
border-radius:14px;
font-size:16px;
font-weight:800;
}

.play{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:120px;
height:120px;
border-radius:50%;
background:rgba(255,255,255,.12);
backdrop-filter:blur(10px);
border:2px solid rgba(255,255,255,.35);
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
box-shadow:0 0 40px rgba(0,0,0,.45);
animation:pulse 1.8s infinite;
}

.play::before{
content:'';
width:0;
height:0;
border-top:18px solid transparent;
border-bottom:18px solid transparent;
border-left:30px solid #fff;
margin-left:8px;
filter:drop-shadow(0 0 10px rgba(255,255,255,.4));
}

@keyframes pulse{
0%{
transform:translate(-50%,-50%) scale(1);
}
50%{
transform:translate(-50%,-50%) scale(1.06);
}
100%{
transform:translate(-50%,-50%) scale(1);
}
}

.watchers{
position:absolute;
bottom:22px;
left:50%;
transform:translateX(-50%);
background:rgba(15,15,15,.92);
padding:16px 24px;
border-radius:18px;
font-size:16px;
font-weight:800;
display:flex;
align-items:center;
gap:10px;
backdrop-filter:blur(8px);
border:1px solid rgba(255,255,255,.08);
box-shadow:0 8px 25px rgba(0,0,0,.45);
}

.watchers i{
font-size:15px;
color:#fff;
opacity:.9;
}

.watching-text{
color:#fff;
letter-spacing:.5px;
white-space:nowrap;
}

→ JOIN FOR FREE

</a>

</div>
</div>
</div>

</body>
</html>
